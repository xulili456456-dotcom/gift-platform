<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理系统</title>
<style>
:root{--red:#C41E3A;--red-dark:#8B0000;--gold:#D4A574;--bg:#FFF8F0;--white:#FFF;--text:#2D2D2D;--muted:#8B7355;--success:#2E7D32;--danger:#DC2626;--blue:#2563EB;--border:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body.login-body{display:flex;align-items:center;justify-content:center}
.login-box{background:var(--white);border-radius:20px;padding:40px 32px;width:380px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,.08);text-align:center}
.login-box h1{font-size:24px;margin-bottom:4px}
.login-box .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:13px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.login-box button:active{transform:scale(.97)}
.login-box .err{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:20px}
header{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:18px}
header .logout{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px}
nav{background:var(--white);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px;position:sticky;top:56px;z-index:99}
nav button{padding:12px 16px;border:none;background:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s}
nav button.active{color:var(--red);border-bottom-color:var(--red);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:12px;padding:16px;border:1px solid var(--border)}
.stat-card .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.red{color:var(--red)}.stat-card .value.green{color:var(--success)}.stat-card .value.blue{color:var(--blue)}
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#fafafa;color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:#fdf5f5}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#e8f5e9;color:var(--success)}.badge-red{background:#fce4ec;color:var(--danger)}
.badge-yellow{background:#fff8e1;color:#f57c00}.badge-gray{background:#f5f5f5;color:#9e9e9e}.badge-blue{background:#e3f2fd;color:var(--blue)}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.96)}.btn-green{background:var(--success);color:#fff}.btn-red{background:var(--danger);color:#fff}
.btn-blue{background:var(--blue);color:#fff}.btn-gray{background:#f0f0f0;color:var(--text)}
.btn-sm{padding:5px 12px;font-size:11px}.btn-xs{padding:3px 8px;font-size:10px;border-radius:6px}
input,select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--red)}
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-row input{flex:1;min-width:150px}.search-row select{width:auto;min-width:100px}.search-row button{width:auto;padding:10px 20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-body{padding:24px}.modal h2{font-size:18px;margin-bottom:16px}
.pagination{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;font-size:13px}
.pagination button{padding:6px 14px}.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.toast{position:fixed;top:20px;right:20px;z-index:999;background:var(--success);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);display:none}
.toast.error{background:var(--danger)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;margin:8px 0}
.kv .k{color:var(--muted)}.kv .v{font-weight:500}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.tabs button{padding:8px 16px;border:none;background:none;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500}
.tabs button.active{color:var(--red);border-bottom-color:var(--red)}
.batch-bar{background:var(--blue);color:#fff;padding:8px 16px;border-radius:8px;display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body class="login-body">
<div id="loginPage">
<div class="login-box">
<h1>管理后台</h1><p class="sub">请使用管理员账号登录</p>
<input id="loginEmail" placeholder="管理员邮箱" value="admin@gift.com">
<input id="loginPass" type="password" placeholder="密码" value="admin888">
<div class="err" id="loginErr"></div>
<button onclick="doLogin()">登 录</button>
</div></div>

<div id="mainApp" style="display:none;width:100%">
<header><h1>管理后台</h1><button class="logout" style="margin-right:8px" onclick="soundEnabled=!soundEnabled;this.textContent=soundEnabled?'🔔 提示音':'🔕 静音'">🔔 提示音</button><button class="logout" onclick="logout()">退出登录</button></header>
<nav id="nav"></nav><main id="content"></main></div>
<div class="toast" id="toast"></div>
<script>
var API='/api',token='',currentTab='dashboard';
function doLogin(){
  var e=document.getElementById('loginEmail').value.trim();
  var p=document.getElementById('loginPass').value;
  fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})})
  .then(function(x){if(!x.ok||!x.data.user.is_admin){document.getElementById('loginErr').textContent='需要管理员账号';return}
    token=x.data.access_token;localStorage.setItem('admin_token',token);
    document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';
    document.body.classList.remove('login-body');initApp()})
  .catch(function(){document.getElementById('loginErr').textContent='登录失败'})}
function logout(){localStorage.removeItem('admin_token');location.reload()}
function api(method,path,body){
  return fetch(API+path,{method:method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'请求失败');return d})})}
function toast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' error':'');t.style.display='block';setTimeout(function(){t.style.display='none'},3000)}
function initApp(){var saved=localStorage.getItem('admin_token');if(saved){token=saved;api('GET','/auth/me').then(function(){document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';document.body.classList.remove('login-body');initPending();renderNav();switchTab('dashboard')}).catch(function(){logout()});return}renderNav();switchTab('dashboard')}
function renderNav(){api('GET','/admin/enhanced-stats').then(function(s){var tabs=[['dashboard','仪表盘',0],['users','用户管理',0],['orders','订单',0],['holdings','持仓总览',0],['deposits','充值审批',s.pendingDeposits||0],['withdrawals','提现审批',s.pendingWithdrawals||0],['kyc','实名认证',s.pendingKyc||0],['gifts','礼物管理',0],['tasks','任务管理',0],['notifications','通知群发',0],['flow','资金流水',0],['inviters','佣金排行',0],['ipcheck','IP检测',0],['agents','代理管理',0],['agentflow','代理概览',0],['settings','系统设置',0],['audit','操作日志',0]];document.getElementById('nav').innerHTML=tabs.map(function(x){return'<button class="'+(x[0]===currentTab?'active':'')+'" onclick="switchTab(\''+x[0]+'\')">'+x[1]+(x[2]>0?' <span style="background:var(--danger);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700">'+x[2]+'</span>':'')+'</button>'}).join('')}).catch(function(){renderNavStatic()})}
function renderNavStatic(){var tabs=[['dashboard','仪表盘'],['users','用户管理'],['orders','订单'],['holdings','持仓总览'],['deposits','充值审批'],['withdrawals','提现审批'],['kyc','实名认证'],['gifts','礼物管理'],['tasks','任务管理'],['notifications','通知群发'],['flow','资金流水'],['inviters','佣金排行'],['ipcheck','IP检测'],['agents','代理管理'],['agentflow','代理概览'],['settings','系统设置'],['audit','操作日志']];document.getElementById('nav').innerHTML=tabs.map(function(x){return'<button class="'+(x[0]===currentTab?'active':'')+'" onclick="switchTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function switchTab(tab){currentTab=tab;renderNav();var c=document.getElementById('content');c.innerHTML='<div class="empty">加载中...</div>';if(tab==='dashboard')loadDashboard(c);else if(tab==='users')loadUsers(c);else if(tab==='orders')loadOrders(c);else if(tab==='deposits')loadDeposits(c);else if(tab==='withdrawals')loadWithdrawals(c);else if(tab==='kyc')loadKyc(c);else if(tab==='holdings')loadHoldings(c);else if(tab==='gifts')loadGifts(c);else if(tab==='tasks')loadTasks(c);else if(tab==='notifications')loadNotifications(c);else if(tab==='flow')loadDailyFlow(c);else if(tab==='inviters')loadTopInviters(c);else if(tab==='ipcheck')loadIpCheck(c);else if(tab==='agents')loadAgentManage(c);else if(tab==='agentflow')loadAgentSummary(c);else if(tab==='settings')loadSettings(c);else if(tab==='audit')loadAuditLog(c)}
function loadDashboard(c){api('GET','/admin/enhanced-stats').then(function(s){c.innerHTML='<div class="stats-grid"><div class="stat-card"><div class="label">总用户数</div><div class="value blue">'+(s.totalUsers||0)+'</div></div><div class="stat-card"><div class="label">活跃店铺</div><div class="value">'+(s.totalStores||0)+'</div></div><div class="stat-card"><div class="label">今日交易额</div><div class="value green">$'+(s.todayVolume||0).toFixed(0)+'</div></div><div class="stat-card"><div class="label">本月新用户</div><div class="value">'+(s.newUsersMonth||0)+'</div></div><div class="stat-card"><div class="label">今日订单</div><div class="value">'+(s.ordersToday||0)+'</div></div><div class="stat-card"><div class="label">待审批充值</div><div class="value red">'+(s.pendingDeposits||0)+'</div></div><div class="stat-card"><div class="label">待审批提现</div><div class="value red">'+(s.pendingWithdrawals||0)+'</div></div><div class="stat-card"><div class="label">待审核认证</div><div class="value red">'+(s.pendingKyc||0)+'</div></div></div>'}).catch(function(){c.innerHTML='<div class="empty">加载失败</div>'})}

// ------ USERS ------
var usersPage=1,usersSearch='',uFilterKyc='',uFilterFrozen='',uFilterTier='',selectedUsers=[];
function loadUsers(c){c.innerHTML='<div class="card"><div class="card-body"><div class="search-row"><input id="userSearch" placeholder="搜索邮箱/姓名/手机..." value="'+usersSearch+'"><select id="filterKyc"><option value="">KYC:全部</option><option value="approved">已通过</option><option value="pending">待审核</option><option value="none">未提交</option></select><select id="filterFrozen"><option value="">状态:全部</option><option value="no">正常</option><option value="yes">已冻结</option></select><select id="filterTier"><option value="">店铺:全部</option><option value="small">小型</option><option value="medium">中型</option><option value="large">大型</option><option value="none">无</option></select><button class="btn btn-blue" onclick="doFilterUsers()">搜索</button><button class="btn btn-gray" onclick="exportUsers()" style="margin-left:8px">📥 导出CSV</button></div><div id="batchBar"></div><div id="userTable"></div><div id="userPager" class="pagination"></div></div></div>';document.getElementById('filterKyc').value=uFilterKyc;document.getElementById('filterFrozen').value=uFilterFrozen;document.getElementById('filterTier').value=uFilterTier;loadUserData()}
function doFilterUsers(){usersSearch=document.getElementById('userSearch').value;uFilterKyc=document.getElementById('filterKyc').value;uFilterFrozen=document.getElementById('filterFrozen').value;uFilterTier=document.getElementById('filterTier').value;usersPage=1;selectedUsers=[];loadUserData()}
function loadUserData(){var q='page='+usersPage+'&limit=15&search='+encodeURIComponent(usersSearch)+'&kyc='+uFilterKyc+'&frozen='+uFilterFrozen+'&tier='+uFilterTier;api('GET','/admin/users-filtered?'+q).then(function(d){renderUserTable(d)}).catch(function(e){document.getElementById('userTable').innerHTML='<div class="empty">'+e.message+'</div>'})}
function renderUserTable(d){var users=d.users||[];document.getElementById('batchBar').innerHTML=selectedUsers.length>0?'<div class="batch-bar">已选 '+selectedUsers.length+' 个用户 <button class="btn btn-xs" style="background:#fff;color:var(--blue)" onclick="batchAction(\'freeze\')">批量冻结</button><button class="btn btn-xs" style="background:#fff;color:var(--success)" onclick="batchAction(\'unfreeze\')">批量解冻</button><button class="btn btn-xs" style="background:#fff;color:var(--danger)" onclick="batchAction(\'delete\')">批量删除</button><button class="btn btn-xs btn-gray" onclick="selectedUsers=[];loadUserData()">取消</button></div>':'';document.getElementById('userTable').innerHTML='<table><thead><tr><th><input type="checkbox" onchange="selectedUsers=this.checked?'+JSON.stringify(users.map(function(u){return u.id}))+':[];renderUserTable('+JSON.stringify(d)+')"></th><th>ID</th><th>邮箱</th><th>姓名</th><th>邀请人</th><th>邀请码</th><th>余额</th><th>保证金</th><th>店铺</th><th>实名</th><th>冻结</th><th>备注</th><th>操作</th></tr></thead><tbody>'+(users.length===0?'<tr><td colspan="13" class="empty">暂无用户</td></tr>':users.map(function(u){return'<tr><td><input type="checkbox" '+(selectedUsers.includes(u.id)?'checked':'')+' onchange="if(this.checked)selectedUsers.push('+u.id+');else selectedUsers=selectedUsers.filter(function(x){return x!=='+u.id+'});renderUserTable('+JSON.stringify(d)+')"></td><td>'+u.id+'</td><td>'+u.email+'</td><td>'+(u.name||'-')+'</td><td style="font-size:10px">'+(u.parent_name||u.parent_email||'-')+'</td><td style="font-size:10px;color:var(--blue)">'+(u.referral_code||'-')+'</td><td style="color:var(--success);font-weight:600">$'+u.balance.toFixed(2)+'</td><td>$'+u.store_deposit.toFixed(2)+'</td><td><span class="badge '+(u.store_status==='active'?'badge-green':'badge-gray')+'">'+(u.tier==='small'?'小型':u.tier==='medium'?'中型':u.tier==='large'?'大型':'无')+'</span></td><td><span class="badge '+(u.kyc_status==='approved'?'badge-green':u.kyc_status==='pending'?'badge-yellow':'badge-gray')+'">'+(u.kyc_status==='approved'?'已通过':u.kyc_status==='pending'?'待审核':'未提交')+'</span></td><td>'+(u.frozen?'<span class="badge badge-red">已冻结</span>':'<span class="badge badge-green">正常</span>')+'</td><td style="font-size:10px">'+(u.admin_notes?'有':'')+'</td><td><button class="btn btn-sm btn-blue" onclick="showUserDetail('+u.id+')">管理</button></td></tr>'}).join(''))+'</tbody></table>';var total=Number(d.total)||0,pages=Math.ceil(total/15);document.getElementById('userPager').innerHTML='<button class="btn btn-gray btn-sm" '+(usersPage<=1?'disabled':'')+' onclick="usersPage--;selectedUsers=[];loadUserData()">上一页</button><span>第 '+usersPage+'/'+(pages||1)+' 页</span><button class="btn btn-gray btn-sm" '+(usersPage>=pages?'disabled':'')+' onclick="usersPage++;selectedUsers=[];loadUserData()">下一页</button>'}
function batchAction(action){if(!confirm('确定批量'+(action==='freeze'?'冻结':action==='unfreeze'?'解冻':'删除')+' '+selectedUsers.length+' 个用户？'))return;api('POST','/admin/users/batch',{ids:selectedUsers,action:action}).then(function(r){toast(r.affected+' 个用户已'+(action==='freeze'?'冻结':action==='unfreeze'?'解冻':'删除'));selectedUsers=[];loadUserData()}).catch(function(e){toast(e.message,1)})}

function showUserDetail(id){var c=document.getElementById('content');c.innerHTML='<div class="empty">加载中...</div>';api('GET','/admin/users/'+id).then(function(u){var ud=JSON.stringify(u).replace(/"/g,'&quot;');c.innerHTML='<div class="modal-overlay" onclick="switchTab(\'users\')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-body"><h2>'+(u.name||'用户')+' #'+u.id+'</h2><div class="tabs"><button class="active" onclick="renderDetailTab(\'info\','+ud+')">信息</button><button onclick="loadFinanceTab('+id+')">财务</button><button onclick="loadInviteTab('+id+')">邀请</button><button onclick="loadTaskProgress('+id+')">任务</button><button onclick="renderDetailTab(\'actions\','+ud+')">操作</button></div><div id="detailContent"></div></div></div></div>';renderDetailTab('info',u)}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}
function renderDetailTab(tab,u){var dc=document.getElementById('detailContent');if(tab==='info'){dc.innerHTML='<div class="kv"><div class="k">邮箱</div><div class="v">'+u.email+'</div><div class="k">手机</div><div class="v">'+(u.phone||'-')+'</div><div class="k">邀请码</div><div class="v">'+u.referral_code+'</div><div class="k">注册时间</div><div class="v">'+new Date(u.created_at).toLocaleString()+'</div><div class="k">IP</div><div class="v">'+(u.ip_address||'-')+'</div><div class="k">状态</div><div class="v">'+(u.frozen?'<span class="badge badge-red">已冻结</span>':'<span class="badge badge-green">正常</span>')+'</div></div><div style="margin-top:8px"><span style="color:var(--muted);font-size:12px">备注</span><textarea id="adminNotes" style="width:100%;min-height:60px;margin-top:4px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:12px">'+(u.admin_notes||'')+'</textarea><button class="btn btn-sm btn-blue" style="margin-top:4px" onclick="saveNotes('+u.id+')">保存备注</button></div>'}else if(tab==='actions'){dc.innerHTML='<div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px;align-items:center"><input id="balAmt" type="number" placeholder="金额" style="flex:1" min="1"><input id="balNote" type="text" placeholder="备注" style="width:80px"><button class="btn btn-sm btn-green" onclick="adjBal('+u.id+',1)">上分</button><button class="btn btn-sm btn-red" onclick="adjBal('+u.id+',-1)">下分</button></div><div style="display:flex;gap:8px"><button class="btn btn-sm btn-blue" onclick="editUser('+u.id+',\''+(u.name||'').replace(/'/g,'')+'\',\''+(u.phone||'').replace(/'/g,'')+'\')">编辑</button><button class="btn btn-sm btn-red" onclick="resetPw('+u.id+')">重置密码</button><button class="btn btn-sm '+(u.frozen?'btn-green':'btn-red')+'" onclick="toggleFz('+u.id+','+u.frozen+')">'+(u.frozen?'解冻':'冻结')+'</button><button class="btn btn-sm btn-red" onclick="delUser('+u.id+')">删除</button><button class="btn btn-sm" style="background:#8B5CF6;color:#fff" onclick="loginAs('+u.id+')">模拟登录</button></div></div>'}
  var btns=document.querySelectorAll('.tabs button');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
  if(tab==='info')btns[0].classList.add('active');else if(tab==='actions')btns[4].classList.add('active')}

function loadDailyFlow(c){c.innerHTML='<div class="empty">加载中...</div>';api("GET","/admin/daily-flow").then(function(d){c.innerHTML='<div class="stats-grid"><div class="stat-card"><div class="label">今日充值</div><div class="value green">$'+d.deposits.toFixed(2)+'</div></div><div class="stat-card"><div class="label">今日提现</div><div class="value red">$'+d.withdrawals.toFixed(2)+'</div></div><div class="stat-card"><div class="label">签到奖励</div><div class="value">$'+d.checkins.toFixed(2)+'</div></div><div class="stat-card"><div class="label">Bonus/上下分</div><div class="value blue">$'+d.bonuses.toFixed(2)+'</div></div><div class="stat-card"><div class="label">今日订单</div><div class="value">'+d.orders_count+' 笔</div></div><div class="stat-card"><div class="label">订单金额</div><div class="value">$'+d.orders_volume.toFixed(2)+'</div></div><div class="stat-card"><div class="label">已结算</div><div class="value green">'+d.settled+' 笔</div></div><div class="stat-card"><div class="label">净流入</div><div class="value '+(d.deposits-d.withdrawals>=0?'green':'red')+'">$'+(d.deposits-d.withdrawals).toFixed(2)+'</div></div></div><div class="card"><div class="card-header">日期: '+d.date+'</div></div>'}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}

// ------ TOP INVITERS ------
function loadTopInviters(c){c.innerHTML='<div class="empty">加载中...</div>';api("GET","/admin/top-inviters").then(function(rows){c.innerHTML='<div class="card"><div class="card-header">邀请排行榜 Top 20</div><div class="card-body"><table><thead><tr><th>排名</th><th>用户</th><th>邮箱</th><th>邀请码</th><th>邀请人数</th></tr></thead><tbody>'+(rows.length===0?'<tr><td colspan="5" class="empty">暂无</td></tr>':rows.map(function(r,i){return'<tr><td><b>'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1))+'</b></td><td>'+(r.name||'-')+'</td><td>'+r.email+'</td><td style="color:var(--blue)">'+r.referral_code+'</td><td style="font-weight:700;color:var(--success)">'+r.invite_count+'</td></tr>'}).join(""))+'</tbody></table></div></div>'}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}

// ------ IP DUPLICATES ------
function loadIpCheck(c){c.innerHTML='<div class="empty">加载中...</div>';api("GET","/admin/ip-duplicates").then(function(dups){api("GET","/admin/user-ips").then(function(allIps){c.innerHTML='<div class="card" style="margin-bottom:16px"><div class="card-header">同IP多账号检测 <span style="color:var(--muted);font-weight:400">'+dups.length+' 组可疑</span></div><div class="card-body"><table><thead><tr><th>IP地址</th><th>账号数</th><th>邮箱</th><th>用户ID</th></tr></thead><tbody>'+(dups.length===0?'<tr><td colspan="4" class="empty">✅ 未发现同IP多账号</td></tr>':dups.map(function(r){return'<tr style="background:#fff8e1"><td style="font-weight:700;color:var(--danger)">'+r.ip_address+'</td><td><span class="badge badge-red">'+r.user_count+'</span></td><td style="font-size:11px">'+r.emails.join(", ")+'</td><td>'+r.ids.join(", ")+'</td></tr>'}).join(""))+'</tbody></table></div></div><div class="card"><div class="card-header">全部用户IP记录 <span style="color:var(--muted);font-weight:400">'+allIps.length+' 用户</span></div><div class="card-body"><table><thead><tr><th>用户</th><th>邮箱</th><th>注册IP</th><th>登录IP</th></tr></thead><tbody>'+allIps.map(function(u){var logins=(u.login_ips||[]).filter(function(x){return x!==u.reg_ip});return'<tr><td><b>'+(u.name||'-')+'</b></td><td>'+u.email+'</td><td style="font-family:monospace;font-size:11px">'+u.reg_ip+'</td><td style="font-family:monospace;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(logins.length>0?logins.join(", "):'<span style="color:var(--muted)">仅注册IP</span>')+'</td></tr>'}).join("")+'</tbody></table></div></div>'}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}

function loadAuditLog(c){c.innerHTML='<div class="empty">加载中...</div>';api('GET','/admin/audit-log').then(function(rows){c.innerHTML='<div class="card"><div class="card-header">操作日志</div><div class="card-body"><table><thead><tr><th>时间</th><th>管理员</th><th>操作</th><th>目标</th><th>详情</th></tr></thead><tbody>'+(rows.length===0?'<tr><td colspan="5" class="empty">暂无记录</td></tr>':rows.map(function(a){return'<tr><td style="font-size:10px">'+new Date(a.created_at).toLocaleString()+'</td><td>'+a.admin_name+'</td><td><span class="badge badge-blue">'+a.action+'</span></td><td>'+(a.target_user_id||'-')+'</td><td style="font-size:10px">'+(a.detail||'')+'</td></tr>'}).join(''))+'</tbody></table></div></div>'}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}

var lastPending={deposits:0,withdrawals:0,kyc:0},soundEnabled=true;
function playBeep(){if(!soundEnabled)return;try{var a=new AudioContext();var o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=800;o.type='sine';g.gain.value=0.1;o.start();setTimeout(function(){o.stop();a.close()},150)}catch(e){}}
function checkPending(){api('GET','/admin/enhanced-stats').then(function(s){var d=s.pendingDeposits||0,w=s.pendingWithdrawals||0,k=s.pendingKyc||0;if(d>lastPending.deposits||w>lastPending.withdrawals||k>lastPending.kyc){if(d>lastPending.deposits)toast('新充值待审批: +'+(d-lastPending.deposits));if(w>lastPending.withdrawals)toast('新提现待审批: +'+(w-lastPending.withdrawals));if(k>lastPending.kyc)toast('新KYC待审核: +'+(k-lastPending.kyc));playBeep();renderNav()}lastPending={deposits:d,withdrawals:w,kyc:k}}).catch(function(){})}
function initPending(){api('GET','/admin/enhanced-stats').then(function(s){lastPending={deposits:s.pendingDeposits||0,withdrawals:s.pendingWithdrawals||0,kyc:s.pendingKyc||0}}).catch(function(){})}
setInterval(checkPending,30000);
document.addEventListener('DOMContentLoaded',function(){try{initApp()}catch(e){document.getElementById('loginPage').style.display='flex';document.getElementById('loginErr').textContent='错误: '+e.message}});
</script>
