<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理系统</title>
<style>
:root{--red:#C41E3A;--red-dark:#8B0000;--gold:#D4A574;--bg:#FFF8F0;--white:#FFF;--text:#2D2D2D;--muted:#8B7355;--success:#2E7D32;--danger:#DC2626;--blue:#2563EB;--border:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body.login-body{display:flex;align-items:center;justify-content:center}
.login-box{background:var(--white);border-radius:20px;padding:40px 32px;width:380px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,.08);text-align:center}
.login-box h1{font-size:24px;margin-bottom:4px}
.login-box .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:13px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.login-box button:active{transform:scale(.97)}
.login-box .err{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:20px}
header{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:18px}
header .logout{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px}
nav{background:var(--white);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px;position:sticky;top:56px;z-index:99}
nav button{padding:12px 16px;border:none;background:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s}
nav button.active{color:var(--red);border-bottom-color:var(--red);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:12px;padding:16px;border:1px solid var(--border)}
.stat-card .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.red{color:var(--red)}.stat-card .value.green{color:var(--success)}.stat-card .value.blue{color:var(--blue)}
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#fafafa;color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:#fdf5f5}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#e8f5e9;color:var(--success)}.badge-red{background:#fce4ec;color:var(--danger)}
.badge-yellow{background:#fff8e1;color:#f57c00}.badge-gray{background:#f5f5f5;color:#9e9e9e}.badge-blue{background:#e3f2fd;color:var(--blue)}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.96)}.btn-green{background:var(--success);color:#fff}.btn-red{background:var(--danger);color:#fff}
.btn-blue{background:var(--blue);color:#fff}.btn-gray{background:#f0f0f0;color:var(--text)}
.btn-sm{padding:5px 12px;font-size:11px}.btn-xs{padding:3px 8px;font-size:10px;border-radius:6px}
input,select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--red)}
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-row input{flex:1;min-width:150px}.search-row select{width:auto;min-width:100px}.search-row button{width:auto;padding:10px 20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-body{padding:24px}.modal h2{font-size:18px;margin-bottom:16px}
.pagination{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;font-size:13px}
.pagination button{padding:6px 14px}.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.toast{position:fixed;top:20px;right:20px;z-index:999;background:var(--success);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);display:none}
.toast.error{background:var(--danger)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;margin:8px 0}
.kv .k{color:var(--muted)}.kv .v{font-weight:500}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.tabs button{padding:8px 16px;border:none;background:none;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500}
.tabs button.active{color:var(--red);border-bottom-color:var(--red)}
.batch-bar{background:var(--blue);color:#fff;padding:8px 16px;border-radius:8px;display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body class="login-body">
<div id="loginPage">
<div class="login-box">
<h1>管理后台</h1><p class="sub">请使用管理员账号登录</p>
<input id="loginEmail" placeholder="管理员邮箱" value="admin@gift.com">
<input id="loginPass" type="password" placeholder="密码" value="admin888">
<div class="err" id="loginErr"></div>
<button onclick="doLogin()">登 录</button>
</div></div>

<div id="mainApp" style="display:none;width:100%">
<header><h1>管理后台</h1><button class="logout" onclick="logout()">退出登录</button></header>
<nav id="nav"></nav><main id="content"></main></div>
<div class="toast" id="toast"></div>
<script>
var API='/api',token='',currentTab='dashboard';
function doLogin(){
  var e=document.getElementById('loginEmail').value.trim();
  var p=document.getElementById('loginPass').value;
  fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})})
  .then(function(x){if(!x.ok||!x.data.user.is_admin){document.getElementById('loginErr').textContent='需要管理员账号';return}
    token=x.data.access_token;localStorage.setItem('admin_token',token);
    document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';
    document.body.classList.remove('login-body');initApp()})
  .catch(function(){document.getElementById('loginErr').textContent='登录失败'})}
function logout(){localStorage.removeItem('admin_token');location.reload()}
function api(method,path,body){
  return fetch(API+path,{method:method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'请求失败');return d})})}
function toast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' error':'');t.style.display='block';setTimeout(function(){t.style.display='none'},3000)}
function initApp(){var saved=localStorage.getItem('admin_token');if(saved){token=saved;api('GET','/auth/me').then(function(){document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';document.body.classList.remove('login-body');renderNav();switchTab('dashboard')}).catch(function(){logout()});return}renderNav();switchTab('dashboard')}
function renderNav(){var tabs=[['dashboard','仪表盘'],['users','用户管理'],['orders','订单'],['deposits','充值审批'],['withdrawals','提现审批'],['kyc','实名认证'],['audit','操作日志']];document.getElementById('nav').innerHTML=tabs.map(function(x){return'<button class="'+(x[0]===currentTab?'active':'')+'" onclick="switchTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function switchTab(tab){currentTab=tab;renderNav();var c=document.getElementById('content');c.innerHTML='<div class="empty">加载中...</div>';if(tab==='dashboard')loadDashboard(c);else if(tab==='users')loadUsers(c);else if(tab==='orders')loadOrders(c);else if(tab==='deposits')loadDeposits(c);else if(tab==='withdrawals')loadWithdrawals(c);else if(tab==='kyc')loadKyc(c);else if(tab==='audit')loadAuditLog(c)}
function loadDashboard(c){api('GET','/admin/enhanced-stats').then(function(s){c.innerHTML='<div class="stats-grid"><div class="stat-card"><div class="label">总用户数</div><div class="value blue">'+(s.totalUsers||0)+'</div></div><div class="stat-card"><div class="label">活跃店铺</div><div class="value">'+(s.totalStores||0)+'</div></div><div class="stat-card"><div class="label">总余额</div><div class="value green">$'+(s.totalBalance||0).toFixed(0)+'</div></div><div class="stat-card"><div class="label">总保证金</div><div class="value">$'+(s.totalDeposit||0).toFixed(0)+'</div></div><div class="stat-card"><div class="label">今日订单</div><div class="value">'+(s.ordersToday||0)+'</div></div><div class="stat-card"><div class="label">待审批充值</div><div class="value red">'+(s.pendingDeposits||0)+'</div></div><div class="stat-card"><div class="label">待审批提现</div><div class="value red">'+(s.pendingWithdrawals||0)+'</div></div><div class="stat-card"><div class="label">待审核认证</div><div class="value red">'+(s.pendingKyc||0)+'</div></div></div>'}).catch(function(){c.innerHTML='<div class="empty">加载失败</div>'})}

// ------ USERS ------
var usersPage=1,usersSearch='',uFilterKyc='',uFilterFrozen='',uFilterTier='',selectedUsers=[];
function loadUsers(c){c.innerHTML='<div class="card"><div class="card-body"><div class="search-row"><input id="userSearch" placeholder="搜索邮箱/姓名/手机..." value="'+usersSearch+'"><select id="filterKyc"><option value="">KYC:全部</option><option value="approved">已通过</option><option value="pending">待审核</option><option value="none">未提交</option></select><select id="filterFrozen"><option value="">状态:全部</option><option value="no">正常</option><option value="yes">已冻结</option></select><select id="filterTier"><option value="">店铺:全部</option><option value="small">小型</option><option value="medium">中型</option><option value="large">大型</option><option value="none">无</option></select><button class="btn btn-blue" onclick="doFilterUsers()">搜索</button></div><div id="batchBar"></div><div id="userTable"></div><div id="userPager" class="pagination"></div></div></div>';document.getElementById('filterKyc').value=uFilterKyc;document.getElementById('filterFrozen').value=uFilterFrozen;document.getElementById('filterTier').value=uFilterTier;loadUserData()}
function doFilterUsers(){usersSearch=document.getElementById('userSearch').value;uFilterKyc=document.getElementById('filterKyc').value;uFilterFrozen=document.getElementById('filterFrozen').value;uFilterTier=document.getElementById('filterTier').value;usersPage=1;selectedUsers=[];loadUserData()}
function loadUserData(){var q='page='+usersPage+'&limit=15&search='+encodeURIComponent(usersSearch)+'&kyc='+uFilterKyc+'&frozen='+uFilterFrozen+'&tier='+uFilterTier;api('GET','/admin/users-filtered?'+q).then(function(d){renderUserTable(d)}).catch(function(e){document.getElementById('userTable').innerHTML='<div class="empty">'+e.message+'</div>'})}
function renderUserTable(d){var users=d.users||[];document.getElementById('batchBar').innerHTML=selectedUsers.length>0?'<div class="batch-bar">已选 '+selectedUsers.length+' 个用户 <button class="btn btn-xs" style="background:#fff;color:var(--blue)" onclick="batchAction(\'freeze\')">批量冻结</button><button class="btn btn-xs" style="background:#fff;color:var(--success)" onclick="batchAction(\'unfreeze\')">批量解冻</button><button class="btn btn-xs" style="background:#fff;color:var(--danger)" onclick="batchAction(\'delete\')">批量删除</button><button class="btn btn-xs btn-gray" onclick="selectedUsers=[];loadUserData()">取消</button></div>':'';document.getElementById('userTable').innerHTML='<table><thead><tr><th><input type="checkbox" onchange="selectedUsers=this.checked?'+JSON.stringify(users.map(function(u){return u.id}))+':[];renderUserTable('+JSON.stringify(d)+')"></th><th>ID</th><th>邮箱</th><th>姓名</th><th>邀请人</th><th>邀请码</th><th>余额</th><th>保证金</th><th>店铺</th><th>实名</th><th>冻结</th><th>备注</th><th>操作</th></tr></thead><tbody>'+(users.length===0?'<tr><td colspan="13" class="empty">暂无用户</td></tr>':users.map(function(u){return'<tr><td><input type="checkbox" '+(selectedUsers.includes(u.id)?'checked':'')+' onchange="if(this.checked)selectedUsers.push('+u.id+');else selectedUsers=selectedUsers.filter(function(x){return x!=='+u.id+'});renderUserTable('+JSON.stringify(d)+')"></td><td>'+u.id+'</td><td>'+u.email+'</td><td>'+(u.name||'-')+'</td><td style="font-size:10px">'+(u.parent_name||u.parent_email||'-')+'</td><td style="font-size:10px;color:var(--blue)">'+(u.referral_code||'-')+'</td><td style="color:var(--success);font-weight:600">$'+u.balance.toFixed(2)+'</td><td>$'+u.store_deposit.toFixed(2)+'</td><td><span class="badge '+(u.store_status==='active'?'badge-green':'badge-gray')+'">'+(u.tier==='small'?'小型':u.tier==='medium'?'中型':u.tier==='large'?'大型':'无')+'</span></td><td><span class="badge '+(u.kyc_status==='approved'?'badge-green':u.kyc_status==='pending'?'badge-yellow':'badge-gray')+'">'+(u.kyc_status==='approved'?'已通过':u.kyc_status==='pending'?'待审核':'未提交')+'</span></td><td>'+(u.frozen?'<span class="badge badge-red">已冻结</span>':'<span class="badge badge-green">正常</span>')+'</td><td style="font-size:10px">'+(u.admin_notes?'有':'')+'</td><td><button class="btn btn-sm btn-blue" onclick="showUserDetail('+u.id+')">管理</button></td></tr>'}).join(''))+'</tbody></table>';var total=Number(d.total)||0,pages=Math.ceil(total/15);document.getElementById('userPager').innerHTML='<button class="btn btn-gray btn-sm" '+(usersPage<=1?'disabled':'')+' onclick="usersPage--;selectedUsers=[];loadUserData()">上一页</button><span>第 '+usersPage+'/'+(pages||1)+' 页</span><button class="btn btn-gray btn-sm" '+(usersPage>=pages?'disabled':'')+' onclick="usersPage++;selectedUsers=[];loadUserData()">下一页</button>'}
function batchAction(action){if(!confirm('确定批量'+(action==='freeze'?'冻结':action==='unfreeze'?'解冻':'删除')+' '+selectedUsers.length+' 个用户？'))return;api('POST','/admin/users/batch',{ids:selectedUsers,action:action}).then(function(r){toast(r.affected+' 个用户已'+(action==='freeze'?'冻结':action==='unfreeze'?'解冻':'删除'));selectedUsers=[];loadUserData()}).catch(function(e){toast(e.message,1)})}

function showUserDetail(id){var c=document.getElementById('content');c.innerHTML='<div class="empty">加载中...</div>';api('GET','/admin/users/'+id).then(function(u){var ud=JSON.stringify(u).replace(/"/g,'&quot;');c.innerHTML='<div class="modal-overlay" onclick="switchTab(\'users\')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-body"><h2>'+(u.name||'用户')+' #'+u.id+'</h2><div class="tabs"><button class="active" onclick="renderDetailTab(\'info\','+ud+')">信息</button><button onclick="loadFinanceTab('+id+')">财务</button><button onclick="loadInviteTab('+id+')">邀请</button><button onclick="renderDetailTab(\'actions\','+ud+')">操作</button></div><div id="detailContent"></div></div></div></div>';renderDetailTab('info',u)}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}
function renderDetailTab(tab,u){var dc=document.getElementById('detailContent');if(tab==='info'){dc.innerHTML='<div class="kv"><div class="k">邮箱</div><div class="v">'+u.email+'</div><div class="k">手机</div><div class="v">'+(u.phone||'-')+'</div><div class="k">邀请码</div><div class="v">'+u.referral_code+'</div><div class="k">注册时间</div><div class="v">'+new Date(u.created_at).toLocaleString()+'</div><div class="k">IP</div><div class="v">'+(u.ip_address||'-')+'</div><div class="k">状态</div><div class="v">'+(u.frozen?'<span class="badge badge-red">已冻结</span>':'<span class="badge badge-green">正常</span>')+'</div></div><div style="margin-top:8px"><span style="color:var(--muted);font-size:12px">备注</span><textarea id="adminNotes" style="width:100%;min-height:60px;margin-top:4px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:12px">'+(u.admin_notes||'')+'</textarea><button class="btn btn-sm btn-blue" style="margin-top:4px" onclick="saveNotes('+u.id+')">保存备注</button></div>'}else if(tab==='actions'){dc.innerHTML='<div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:8px;align-items:center"><input id="balAmt" type="number" placeholder="金额" style="flex:1" min="1"><input id="balNote" type="text" placeholder="备注" style="width:80px"><button class="btn btn-sm btn-green" onclick="adjBal('+u.id+',1)">上分</button><button class="btn btn-sm btn-red" onclick="adjBal('+u.id+',-1)">下分</button></div><div style="display:flex;gap:8px"><button class="btn btn-sm btn-blue" onclick="editUser('+u.id+',\''+(u.name||'').replace(/'/g,'')+'\',\''+(u.phone||'').replace(/'/g,'')+'\')">编辑</button><button class="btn btn-sm btn-red" onclick="resetPw('+u.id+')">重置密码</button><button class="btn btn-sm '+(u.frozen?'btn-green':'btn-red')+'" onclick="toggleFz('+u.id+','+u.frozen+')">'+(u.frozen?'解冻':'冻结')+'</button><button class="btn btn-sm btn-red" onclick="delUser('+u.id+')">删除</button><button class="btn btn-sm" style="background:#8B5CF6;color:#fff" onclick="loginAs('+u.id+')">模拟登录</button></div></div>'}
  var btns=document.querySelectorAll('.tabs button');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');
  if(tab==='info')btns[0].classList.add('active');else if(tab==='actions')btns[3].classList.add('active')}
function loadFinanceTab(id){var dc=document.getElementById('detailContent');dc.innerHTML='<div class="empty">加载中...</div>';api('GET','/admin/users/'+id+'/finance').then(function(f){var h='<div style="font-size:11px">';if(f.earnings.length){h+='<p style="font-weight:700;margin-bottom:4px">余额流水 ('+f.earnings.length+')</p>';f.earnings.slice(0,10).forEach(function(e){h+='<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0"><span>'+e.type+'</span><span style="color:var(--success)">+$'+Number(e.amount).toFixed(2)+'</span><span style="color:var(--muted);font-size:10px">'+new Date(e.created_at).toLocaleString()+'</span></div>'})}if(f.orders.length){h+='<p style="font-weight:700;margin:8px 0 4px">订单 ('+f.orders.length+')</p>';f.orders.slice(0,10).forEach(function(o){h+='<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0"><span>#'+o.id+' '+(o.product_name||'')+'</span><span class="badge '+(o.status==='done'?'badge-green':'badge-yellow')+'">'+(o.status==='done'?'已完成':'持仓中')+'</span><span style="color:var(--muted);font-size:10px">'+new Date(o.created_at).toLocaleString()+'</span></div>'})}if(f.deposits.length){h+='<p style="font-weight:700;margin:8px 0 4px">充值 ('+f.deposits.length+')</p>';f.deposits.slice(0,5).forEach(function(d){h+='<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+d.network+'</span><span>$'+Number(d.amount).toFixed(2)+'</span><span class="badge '+(d.status==='confirmed'?'badge-green':'badge-yellow')+'">'+d.status+'</span></div>'})}if(f.withdrawals.length){h+='<p style="font-weight:700;margin:8px 0 4px">提现 ('+f.withdrawals.length+')</p>';f.withdrawals.slice(0,5).forEach(function(w){h+='<div style="display:flex;justify-content:space-between;padding:3px 0"><span>'+w.network+'</span><span>$'+Number(w.amount).toFixed(2)+'</span><span class="badge '+(w.status==='completed'?'badge-green':w.status==='pending'?'badge-yellow':'badge-red')+'">'+w.status+'</span></div>'})}h+='</div>';dc.innerHTML=h;var btns=document.querySelectorAll('.tabs button');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');btns[1].classList.add('active')}).catch(function(e){dc.innerHTML='<div class="empty">'+e.message+'</div>'})}
function loadInviteTab(id){var dc=document.getElementById('detailContent');dc.innerHTML='<div class="empty">加载中...</div>';api('GET','/admin/users/'+id).then(function(u){var h='';if(u.parent_id){api('GET','/admin/users/'+u.parent_id).then(function(p){dc.innerHTML='<p style="font-size:12px;margin-bottom:8px">上级: <b>'+(p.name||p.email)+'</b></p>'})}else h='<p style="font-size:12px;margin-bottom:8px;color:var(--muted)">无上级</p>';api('GET','/admin/users/'+id+'/tree').then(function(t){h+='<p style="font-size:12px;font-weight:700">下级邀请 ('+(t.length||0)+'人)</p>';if(t.length)h+='<table style="margin-top:4px"><tr><th>等级</th><th>用户</th></tr>'+t.map(function(i){return'<tr><td>Lv'+i.level+'</td><td>'+(i.name||i.email)+'</td></tr>'}).join('')+'</table>';dc.innerHTML=h}).catch(function(){dc.innerHTML=h+'<p style="color:var(--muted)">无下级</p>'});var btns=document.querySelectorAll('.tabs button');for(var i=0;i<btns.length;i++)btns[i].classList.remove('active');btns[2].classList.add('active')}).catch(function(e){dc.innerHTML='<div class="empty">加载失败</div>'})}
function saveNotes(id){var n=document.getElementById('adminNotes').value;api('PUT','/admin/users/'+id+'/notes',{notes:n}).then(function(){toast('备注已保存')}).catch(function(e){toast(e.message,1)})}
function adjBal(id,sign){var amt=parseFloat(document.getElementById('balAmt').value);if(!amt||amt<0){toast('请输入有效金额',1);return}var note=document.getElementById('balNote').value||'',total=sign>0?amt:-amt,label=sign>0?'上分 $'+amt:'下分 $'+amt;if(!confirm('确认'+label+'？'))return;api('POST','/admin/users/'+id+'/balance',{amount:total,note:note}).then(function(d){toast(label+' 成功,余额:$'+d.newBalance.toFixed(2));switchTab('users')}).catch(function(e){toast(e.message,1)})}
function editUser(id,name,phone){var n=prompt('新姓名:',name);if(n===null)return;var p=prompt('新手机号:',phone);if(p===null)return;api('PUT','/admin/users/'+id,{name:n,phone:p}).then(function(){toast('已更新');switchTab('users')}).catch(function(e){toast(e.message,1)})}
function resetPw(id){var pw=prompt('新密码(8位以上):');if(!pw||pw.length<8){toast('至少8位',1);return}api('POST','/admin/users/'+id+'/reset-password',{newPassword:pw}).then(function(){toast('密码已重置')}).catch(function(e){toast(e.message,1)})}
function toggleFz(id,c){api('PUT','/admin/users/'+id+'/freeze',{frozen:!c}).then(function(){toast(c?'已解冻':'已冻结');switchTab('users')}).catch(function(e){toast(e.message,1)})}
function delUser(id){if(!confirm('确定删除？不可恢复！'))return;api('DELETE','/admin/users/'+id).then(function(){toast('已删除');switchTab('users')}).catch(function(e){toast(e.message,1)})}
function loginAs(id){api('POST','/admin/users/'+id+'/login-as').then(function(d){window.open(d.redirect,'_blank')}).catch(function(e){toast(e.message,1)})}

// ------ ORDERS / DEPOSITS / WITHDRAWALS / KYC ------
var ordersPage=1,ordersStatus='',ordersUser='';
function loadOrders(c){c.innerHTML='<div class="card"><div class="card-body"><div class="search-row"><input id="orderUser" placeholder="用户ID" value="'+ordersUser+'"><select id="orderStatus"><option value="">全部</option><option value="holding">持仓中</option><option value="done">已完成</option></select><button class="btn btn-blue" onclick="ordersUser=document.getElementById(\'orderUser\').value;ordersStatus=document.getElementById(\'orderStatus\').value;ordersPage=1;loadOrders(document.getElementById(\'content\'))">筛选</button></div><div id="orderTable"></div><div id="orderPager" class="pagination"></div></div></div>';document.getElementById('orderStatus').value=ordersStatus;api('GET','/admin/orders?page='+ordersPage+'&limit=20&user_id='+ordersUser+'&status='+ordersStatus).then(function(d){var orders=d.orders||[];document.getElementById('orderTable').innerHTML='<table><thead><tr><th>ID</th><th>用户</th><th>产品</th><th>成本</th><th>利润</th><th>状态</th><th>时间</th></tr></thead><tbody>'+(orders.length===0?'<tr><td colspan="7" class="empty">暂无</td></tr>':orders.map(function(o){return'<tr><td>#'+o.id+'</td><td>'+o.user_name+' (#'+o.user_id+')</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(o.product_name||'-')+'</td><td>$'+Number(o.amount||0).toFixed(2)+'</td><td style="color:var(--success);font-weight:600">+$'+(Number(o.amount||0)*0.15/0.85).toFixed(2)+'</td><td><span class="badge '+(o.status==='done'?'badge-green':'badge-yellow')+'">'+(o.status==='done'?'已完成':'持仓中')+'</span></td><td style="font-size:10px">'+new Date(o.created_at).toLocaleString()+'</td></tr>'}).join(''))+'</tbody></table>';var total=Number(d.total)||0,pages=Math.ceil(total/20);document.getElementById('orderPager').innerHTML='<button class="btn btn-gray btn-sm" '+(ordersPage<=1?'disabled':'')+' onclick="ordersPage--;loadOrders(document.getElementById(\'content\'))">上一页</button><span>第 '+ordersPage+'/'+(pages||1)+' 页 ('+total+')</span><button class="btn btn-gray btn-sm" '+(ordersPage>=pages?'disabled':'')+' onclick="ordersPage++;loadOrders(document.getElementById(\'content\'))">下一页</button>'}).catch(function(e){document.getElementById('orderTable').innerHTML='<div class="empty">'+e.message+'</div>'})}

function loadDeposits(c){c.innerHTML='<div class="empty">加载中...</div>';api('GET','/deposits/admin').then(function(rows){c.innerHTML='<div class="card"><div class="card-header">充值审批</div><div class="card-body"><table><thead><tr><th>ID</th><th>用户</th><th>网络</th><th>金额</th><th>哈希</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>'+(rows.length===0?'<tr><td colspan="8" class="empty">暂无</td></tr>':rows.map(function(d){return'<tr><td>#'+d.id+'</td><td>'+d.name+' (#'+d.user_id+')</td><td><span class="badge badge-blue">'+d.network.toUpperCase()+'</span></td><td style="font-weight:700">$'+Number(d.amount).toFixed(2)+'</td><td style="font-size:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+d.tx_hash+'</td><td><span class="badge '+(d.status==='confirmed'?'badge-green':d.status==='pending'?'badge-yellow':'badge-red')+'">'+(d.status==='confirmed'?'已确认':d.status==='pending'?'待审核':'已拒绝')+'</span></td><td style="font-size:10px">'+new Date(d.created_at).toLocaleString()+'</td><td>'+(d.status==='pending'?'<button class="btn btn-xs btn-green" onclick="confirmDeposit('+d.id+')">确认</button><button class="btn btn-xs btn-red" onclick="rejectDeposit('+d.id+')">拒绝</button>':'-')+'</td></tr>'}).join(''))+'</tbody></table></div></div>'}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}
function confirmDeposit(id){if(!confirm('确认充值？'))return;api('PUT','/deposits/'+id+'/confirm',{}).then(function(){toast('已确认');switchTab('deposits')}).catch(function(e){toast(e.message,1)})}
function rejectDeposit(id){if(!confirm('拒绝充值？'))return;api('PUT','/deposits/'+id+'/reject',{}).then(function(){toast('已拒绝');switchTab('deposits')}).catch(function(e){toast(e.message,1)})}

var wPage=1,wFilter='';
function loadWithdrawals(c){c.innerHTML='<div class="empty">加载中...</div>';api('GET','/admin/withdrawals?page='+wPage+'&limit=20&status='+wFilter).then(function(d){var rows=d.withdrawals||[];c.innerHTML='<div class="card"><div class="card-header">提现审批<div style="display:flex;gap:4px">'+['','pending','completed','rejected'].map(function(s){return'<button class="btn btn-xs '+(wFilter===s?'btn-blue':'btn-gray')+'" onclick="wFilter=\''+s+'\';wPage=1;loadWithdrawals(document.getElementById(\'content\'))">'+(s===''?'全部':s==='pending'?'待审批':s==='completed'?'已完成':'已拒绝')+'</button>'}).join('')+'</div></div><div class="card-body"><table><thead><tr><th>ID</th><th>用户</th><th>金额</th><th>网络</th><th>地址</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>'+(rows.length===0?'<tr><td colspan="8" class="empty">暂无</td></tr>':rows.map(function(w){return'<tr><td>#'+w.id+'</td><td>'+w.user_name+' (#'+w.user_id+')</td><td style="font-weight:700">$'+Number(w.amount).toFixed(2)+'</td><td>'+w.network+'</td><td style="font-size:10px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(w.wallet_address||'-')+'</td><td><span class="badge '+(w.status==='completed'?'badge-green':w.status==='pending'?'badge-yellow':'badge-red')+'">'+(w.status==='completed'?'已完成':w.status==='pending'?'待审批':'已拒绝')+'</span></td><td style="font-size:10px">'+new Date(w.created_at).toLocaleString()+'</td><td>'+(w.status==='pending'?'<button class="btn btn-xs btn-green" onclick="approveWithdrawal('+w.id+')">通过</button><button class="btn btn-xs btn-red" onclick="rejectWithdrawal('+w.id+')">拒绝</button>':'-')+'</td></tr>'}).join(''))+'</tbody></table></div></div>'}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}
function approveWithdrawal(id){if(!confirm('确认通过？'))return;api('PUT','/admin/withdrawals/'+id,{status:'completed'}).then(function(){toast('已通过');switchTab('withdrawals')}).catch(function(e){toast(e.message,1)})}
function rejectWithdrawal(id){if(!confirm('确认拒绝？'))return;api('PUT','/admin/withdrawals/'+id,{status:'rejected'}).then(function(){toast('已拒绝');switchTab('withdrawals')}).catch(function(e){toast(e.message,1)})}

function loadKyc(c){c.innerHTML='<div class="empty">加载中...</div>';api('GET','/kyc/admin/list').then(function(rows){c.innerHTML='<div class="card"><div class="card-header">实名认证</div><div class="card-body"><table><thead><tr><th>ID</th><th>用户</th><th>姓名</th><th>证件号</th><th>照片</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>'+(rows.length===0?'<tr><td colspan="8" class="empty">暂无</td></tr>':rows.map(function(k){return'<tr><td>#'+k.id+'</td><td>'+k.user_name+' (#'+k.user_id+')</td><td>'+k.real_name+'</td><td style="font-size:11px">'+k.id_number+'</td><td style="display:flex;gap:8px">'+(k.front_image?'<img src="'+k.front_image+'" onclick="viewKycImage(this)" style="width:60px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer">':'无')+(k.back_image?'<img src="'+k.back_image+'" onclick="viewKycImage(this)" style="width:60px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--border);cursor:pointer">':'')+'</td><td><span class="badge '+(k.status==='approved'?'badge-green':k.status==='pending'?'badge-yellow':'badge-red')+'">'+(k.status==='approved'?'已通过':k.status==='pending'?'待审核':'已拒绝')+'</span></td><td style="font-size:10px">'+new Date(k.submitted_at).toLocaleString()+'</td><td>'+(k.status==='pending'?'<button class="btn btn-xs btn-green" onclick="approveKyc('+k.id+')">通过</button><button class="btn btn-xs btn-red" onclick="rejectKyc('+k.id+')">拒绝</button>':'-')+'</td></tr>'}).join(''))+'</tbody></table></div></div>'}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}
function approveKyc(id){api('PUT','/kyc/admin/'+id,{status:'approved'}).then(function(){toast('已通过');switchTab('kyc')}).catch(function(e){toast(e.message,1)})}
function rejectKyc(id){api('PUT','/kyc/admin/'+id,{status:'rejected'}).then(function(){toast('已拒绝');switchTab('kyc')}).catch(function(e){toast(e.message,1)})}
function viewKycImage(el){var s=el.getAttribute('src');var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;cursor:pointer';d.onclick=function(){d.remove()};var i=document.createElement('img');i.src=s;i.style.cssText='max-width:95vw;max-height:95vh;object-fit:contain;pointer-events:none';d.appendChild(i);document.body.appendChild(d)}

function loadAuditLog(c){c.innerHTML='<div class="empty">加载中...</div>';api('GET','/admin/audit-log').then(function(rows){c.innerHTML='<div class="card"><div class="card-header">操作日志</div><div class="card-body"><table><thead><tr><th>时间</th><th>管理员</th><th>操作</th><th>目标</th><th>详情</th></tr></thead><tbody>'+(rows.length===0?'<tr><td colspan="5" class="empty">暂无记录</td></tr>':rows.map(function(a){return'<tr><td style="font-size:10px">'+new Date(a.created_at).toLocaleString()+'</td><td>'+a.admin_name+'</td><td><span class="badge badge-blue">'+a.action+'</span></td><td>'+(a.target_user_id||'-')+'</td><td style="font-size:10px">'+(a.detail||'')+'</td></tr>'}).join(''))+'</tbody></table></div></div>'}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}

document.addEventListener('DOMContentLoaded',function(){try{initApp()}catch(e){document.getElementById('loginPage').style.display='flex';document.getElementById('loginErr').textContent='错误: '+e.message}});
</script>
