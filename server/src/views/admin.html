<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理系统</title>
<style>
:root{--red:#C41E3A;--red-dark:#8B0000;--gold:#D4A574;--bg:#FFF8F0;--white:#FFF;--text:#2D2D2D;--muted:#8B7355;--success:#2E7D32;--danger:#DC2626;--blue:#2563EB;--border:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body.login-body{display:flex;align-items:center;justify-content:center}
.login-box{background:var(--white);border-radius:20px;padding:40px 32px;width:380px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,.08);text-align:center}
.login-box h1{font-size:24px;margin-bottom:4px}
.login-box .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:13px;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.login-box button:active{transform:scale(.97)}
.login-box .err{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:20px}
header{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:18px}
header .logout{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px}
nav{background:var(--white);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px;position:sticky;top:56px;z-index:99}
nav button{padding:12px 16px;border:none;background:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s}
nav button.active{color:var(--red);border-bottom-color:var(--red);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:12px;padding:16px;border:1px solid var(--border)}
.stat-card .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.stat-card .value{font-size:24px;font-weight:700}
.stat-card .value.red{color:var(--red)}.stat-card .value.green{color:var(--success)}.stat-card .value.blue{color:var(--blue)}
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#fafafa;color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:hover{background:#fdf5f5}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#e8f5e9;color:var(--success)}.badge-red{background:#fce4ec;color:var(--danger)}
.badge-yellow{background:#fff8e1;color:#f57c00}.badge-gray{background:#f5f5f5;color:#9e9e9e}.badge-blue{background:#e3f2fd;color:var(--blue)}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.96)}.btn-green{background:var(--success);color:#fff}.btn-red{background:var(--danger);color:#fff}
.btn-blue{background:var(--blue);color:#fff}.btn-gray{background:#f0f0f0;color:var(--text)}
.btn-sm{padding:5px 12px;font-size:11px}.btn-xs{padding:3px 8px;font-size:10px;border-radius:6px}
input,select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--red)}
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-row input{flex:1;min-width:150px}.search-row select{width:auto;min-width:100px}.search-row button{width:auto;padding:10px 20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-body{padding:24px}.modal h2{font-size:18px;margin-bottom:16px}
.pagination{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;font-size:13px}
.pagination button{padding:6px 14px}.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
.toast{position:fixed;top:20px;right:20px;z-index:999;background:var(--success);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);display:none}
.toast.error{background:var(--danger)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;margin:8px 0}
.kv .k{color:var(--muted)}.kv .v{font-weight:500}
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.tabs button{padding:8px 16px;border:none;background:none;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:500}
.tabs button.active{color:var(--red);border-bottom-color:var(--red)}
.batch-bar{background:var(--blue);color:#fff;padding:8px 16px;border-radius:8px;display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body class="login-body">
<div id="loginPage">
<div class="login-box">
<h1>管理后台</h1><p class="sub">请使用管理员账号登录</p>
<input id="loginEmail" placeholder="管理员邮箱" value="admin@gift.com">
<input id="loginPass" type="password" placeholder="密� �" value="admin888">
<div class="err" id="loginErr"></div>
<button onclick="doLogin()">登 录</button>
</div></div>

<div id="mainApp" style="display:none;width:100%">
<header><h1>🛡️ 管理后台</h1><button class="logout" onclick="logout()">退出登录</button></header>
<nav id="nav"></nav><main id="content"></main></div>
<div class="toast" id="toast"></div>

<script>
const API='/api';let token='',currentTab='dashboard';

async function doLogin(){
  const e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;
  try{
    const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});
    const d=await r.json();
    if(!r.ok||!d.user?.is_admin){document.getElementById('loginErr').textContent='需要管理员账号';return;}
    token=d.access_token;localStorage.setItem('admin_token',token);
    document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';
    document.body.classList.remove('login-body');initApp();
  }catch(ex){document.getElementById('loginErr').textContent='登录失败'}
}
function logout(){localStorage.removeItem('admin_token');location.reload()}
async function api(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API+path,opts);const d=await r.json();
  if(!r.ok)throw new Error(d.error||'请求失败');return d;
}
function showToast(msg,isErr){const t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(isErr?' error':'');t.style.display='block';setTimeout(()=>t.style.display='none',3000)}

async function initApp(){
  const saved=localStorage.getItem('admin_token');
  if(saved){token=saved;try{await api('GET','/auth/me');document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';document.body.classList.remove('login-body');}catch(e){logout();return}}
  renderNav();switchTab('dashboard');
}
function renderNav(){
  const tabs=[['dashboard','📊 仪表盘'],['users','👥 用户管理'],['orders','📦 订单'],['deposits','💵 �

值审批'],['withdrawals','💸 提现审批'],['kyc','🛂 实名认证'],['audit','📋 操作日志']];
  document.getElementById('nav').innerHTML=tabs.map(([k,v])=>`<button class="${k===currentTab?'active':''}" onclick="switchTab('${k}')">${v}</button>`).join('');
}
async function switchTab(tab){currentTab=tab;renderNav();const c=document.getElementById('content');c.innerHTML='<div class="empty">� 载中...</div>';
  if(tab==='dashboard')await loadDashboard(c);else if(tab==='users')await loadUsers(c);else if(tab==='orders')await loadOrders(c);
  else if(tab==='deposits')await loadDeposits(c);else if(tab==='withdrawals')await loadWithdrawals(c);
  else if(tab==='kyc')await loadKyc(c);else if(tab==='audit')await loadAuditLog(c);
}

async function loadDashboard(c){
  let stats={};try{stats=await api('GET','/admin/enhanced-stats')}catch(e){}
  c.innerHTML=`<div class="stats-grid">
    <div class="stat-card"><div class="label">总用户数</div><div class="value blue">${stats.totalUsers||0}</div></div>
    <div class="stat-card"><div class="label">活跃店铺</div><div class="value">${stats.totalStores||0}</div></div>
    <div class="stat-card"><div class="label">总余额</div><div class="value green">$${(stats.totalBalance||0).toFixed(0)}</div></div>
    <div class="stat-card"><div class="label">总保证金</div><div class="value">$${(stats.totalDeposit||0).toFixed(0)}</div></div>
    <div class="stat-card"><div class="label">今日订单</div><div class="value">${stats.ordersToday||0}</div></div>
    <div class="stat-card"><div class="label">�
审批�

值</div><div class="value red">${stats.pendingDeposits||0}</div></div>
    <div class="stat-card"><div class="label">�
审批提现</div><div class="value red">${stats.pendingWithdrawals||0}</div></div>
    <div class="stat-card"><div class="label">�
审� �认证</div><div class="value red">${stats.pendingKyc||0}</div></div>
  </div>`;
}

// ========== USERS ==========
let usersPage=1,usersSearch='',uFilterKyc='',uFilterFrozen='',uFilterTier='',selectedUsers=[];
async function loadUsers(c){
  c.innerHTML=`<div class="card"><div class="card-body">
    <div class="search-row">
      <input id="userSearch" placeholder="搜索邮箱/姓名/手机..." value="${usersSearch}" onkeydown="if(event.key==='Enter'){usersSearch=this.value;usersPage=1;loadUsers(document.getElementById('content'))}">
      <select id="filterKyc" onchange="uFilterKyc=this.value;usersPage=1;selectedUsers=[];loadUsers(document.getElementById('content'))"><option value="">KYC:�
�部</option><option value="approved" ${uFilterKyc==='approved'?'selected':''}>已通过</option><option value="pending" ${uFilterKyc==='pending'?'selected':''}>�
审� �</option><option value="none" ${uFilterKyc==='none'?'selected':''}>未提交</option></select>
      <select id="filterFrozen" onchange="uFilterFrozen=this.value;usersPage=1;selectedUsers=[];loadUsers(document.getElementById('content'))"><option value="">状态:�
�部</option><option value="no" ${uFilterFrozen==='no'?'selected':''}>正常</option><option value="yes" ${uFilterFrozen==='yes'?'selected':''}>已冻结</option></select>
      <select id="filterTier" onchange="uFilterTier=this.value;usersPage=1;selectedUsers=[];loadUsers(document.getElementById('content'))"><option value="">店铺:�
�部</option><option value="small" ${uFilterTier==='small'?'selected':''}>小型</option><option value="medium" ${uFilterTier==='medium'?'selected':''}>中型</option><option value="large" ${uFilterTier==='large'?'selected':''}>大型</option><option value="none" ${uFilterTier==='none'?'selected':''}>� </option></select>
      <button class="btn btn-blue" onclick="usersSearch=document.getElementById('userSearch').value;uFilterKyc=document.getElementById('filterKyc').value;uFilterFrozen=document.getElementById('filterFrozen').value;uFilterTier=document.getElementById('filterTier').value;usersPage=1;selectedUsers=[];loadUsers(document.getElementById('content'))">搜索</button>
    </div>
    <div id="batchBar"></div>
    <div id="userTable"></div><div id="userPager" class="pagination"></div>
  </div></div>`;
  try{
    const q=new URLSearchParams({page:usersPage,limit:15,search:usersSearch,kyc:uFilterKyc,frozen:uFilterFrozen,tier:uFilterTier});
    const d=await api('GET','/admin/users-filtered?'+q.toString());
    renderUserTable(d);
  }catch(e){document.getElementById('userTable').innerHTML='<div class="empty">� 载失败: '+e.message+'</div>'}
}
function renderUserTable(d){
  const users=d.users||[];
  document.getElementById('batchBar').innerHTML=selectedUsers.length>0?`<div class="batch-bar">已选 ${selectedUsers.length} 个用户 <button class="btn btn-xs" style="background:#fff;color:var(--blue)" onclick="batchAction('freeze')">批量冻结</button><button class="btn btn-xs" style="background:#fff;color:var(--success)" onclick="batchAction('unfreeze')">批量解冻</button><button class="btn btn-xs" style="background:#fff;color:var(--danger)" onclick="batchAction('delete')">批量� 除</button><button class="btn btn-xs btn-gray" onclick="selectedUsers=[];loadUsers(document.getElementById('content'))">取消</button></div>`:'';
  document.getElementById('userTable').innerHTML=`<table><thead><tr>
    <th><input type="checkbox" onchange="toggleAllUsers(this,${JSON.stringify(users.map(u=>u.id))})"></th>
    <th>ID</th><th>邮箱</th><th>姓名</th><th>手机</th><th>邀请� �</th><th>余额</th><th>保证金</th><th>店铺</th><th>实名</th><th>冻结</th><th>备注</th><th>操作</th>
  </tr></thead><tbody>${users.length===0?'<tr><td colspan="13" class="empty">暂� 用户</td></tr>':
    users.map(u=>`<tr>
      <td><input type="checkbox" ${selectedUsers.includes(u.id)?'checked':''} onchange="toggleUser(${u.id},this.checked)"></td>
      <td>${u.id}</td><td>${u.email}</td><td>${u.name||'-'}</td><td>${u.phone||'-'}</td>
      <td style="font-size:10px;color:var(--blue)">${u.referral_code||'-'}</td>
      <td style="color:var(--success);font-weight:600">$${u.balance.toFixed(2)}</td><td>$${u.store_deposit.toFixed(2)}</td>
      <td><span class="badge ${u.store_status==='active'?'badge-green':'badge-gray'}">${u.tier==='small'?'小型':u.tier==='medium'?'中型':u.tier==='large'?'大型':'� '}</span></td>
      <td><span class="badge ${u.kyc_status==='approved'?'badge-green':u.kyc_status==='pending'?'badge-yellow':'badge-gray'}">${u.kyc_status==='approved'?'已通过':u.kyc_status==='pending'?'�
审� �':'未提交'}</span></td>
      <td>${u.frozen?'<span class="badge badge-red">已冻结</span>':'<span class="badge badge-green">正常</span>'}</td>
      <td style="font-size:10px">${u.admin_notes?'📝':''}</td>
      <td><button class="btn btn-sm btn-blue" onclick="showUserDetail(${u.id})">管理</button></td>
    </tr>`).join('')}</tbody></table>`;
  const total=Number(d.total)||0,pages=Math.ceil(total/15);
  document.getElementById('userPager').innerHTML=`<button class="btn btn-gray btn-sm" ${usersPage<=1?'disabled':''} onclick="usersPage--;selectedUsers=[];loadUsers(document.getElementById('content'))">上一页</button><span>第 ${usersPage}/${pages||1} 页</span><button class="btn btn-gray btn-sm" ${usersPage>=pages?'disabled':''} onclick="usersPage++;selectedUsers=[];loadUsers(document.getElementById('content'))">下一页</button>`;
}
function toggleUser(id,checked){if(checked)selectedUsers.push(id);else selectedUsers=selectedUsers.filter(x=>x!==id);loadUsers(document.getElementById('content'))}
function toggleAllUsers(cb,ids){selectedUsers=cb.checked?[...ids]:[];loadUsers(document.getElementById('content'))}
async function batchAction(action){
  if(!confirm(`确定批量${action==='freeze'?'冻结':action==='unfreeze'?'解冻':'� 除'} ${selectedUsers.length} 个用户？`))return;
  try{const r=await api('POST','/admin/users/batch',{ids:selectedUsers,action});showToast(`${r.affected} 个用户已${action==='freeze'?'冻结':action==='unfreeze'?'解冻':'� 除'}`);selectedUsers=[];loadUsers(document.getElementById('content'))}catch(e){showToast(e.message,1)}
}

// ========== USER DETAIL (multi-tab) ==========
async function showUserDetail(id){
  const c=document.getElementById('content');c.innerHTML='<div class="empty">� 载中...</div>';
  try{
    const u=await api('GET','/admin/users/'+id);
    c.innerHTML=`<div class="modal-overlay" onclick="switchTab('users')"><div class="modal" onclick="event.stopPropagation()">
      <div class="modal-body">
      <h2>👤 ${u.name||'用户'} #${u.id}</h2>
      <div class="tabs">
        <button class="active" onclick="switchDetailTab(this,'info',${id})">📋 信息</button>
        <button onclick="switchDetailTab(this,'finance',${id})">💰 财务</button>
        <button onclick="switchDetailTab(this,'invite',${id})">👥 邀请</button>
        <button onclick="switchDetailTab(this,'actions',${id})">⚡ 操作</button>
      </div>
      <div id="detailContent"></div></div></div></div>`;
    await renderDetailTab('info',u);
  }catch(e){c.innerHTML='<div class="empty">� 载失败: '+e.message+'</div>'}
}
async function switchDetailTab(btn,tab,id){
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  try{var u=await api('GET','/admin/users/'+id);await renderDetailTab(tab,u,id)}catch(e){}
}
async function renderDetailTab(tab,u,id){
  const dc=document.getElementById('detailContent');
  if(tab==='info'){
    dc.innerHTML=`<div class="kv">
      <div class="k">邮箱</div><div class="v">${u.email}</div><div class="k">手机</div><div class="v">${u.phone||'-'}</div>
      <div class="k">邀请� �</div><div class="v">${u.referral_code}</div><div class="k">注册时间</div><div class="v">${new Date(u.created_at).toLocaleString()}</div>
      <div class="k">IP地址</div><div class="v">${u.ip_address||'-'}</div>
      <div class="k">冻结</div><div class="v">${u.frozen?'<span class="badge badge-red">已冻结</span>':'<span class="badge badge-green">正常</span>'}</div>
    </div>
    <div style="margin-top:8px"><span class="k" style="color:var(--muted);font-size:12px">备注</span>
      <textarea id="adminNotes" style="width:100%;min-height:60px;margin-top:4px;padding:8px;border-radius:8px;border:1px solid var(--border);font-size:12px">${u.admin_notes||''}</textarea>
      <button class="btn btn-sm btn-blue" style="margin-top:4px" onclick="saveNotes(${id})">保存备注</button>
    </div>`;
  }else if(tab==='finance'){
    dc.innerHTML='<div class="empty">� 载中...</div>';
    try{
      const f=await api('GET','/admin/users/'+id+'/finance');
      let html='<div style="font-size:11px">';
      html+=`<p style="font-weight:700;margin-bottom:4px">💰 余额流水 (${f.earnings.length})</p>`;
      f.earnings.slice(0,10).forEach(e=>html+=`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0"><span>${e.type}</span><span style="color:var(--success)">+$${Number(e.amount).toFixed(2)}</span><span style="color:var(--muted);font-size:10px">${new Date(e.created_at).toLocaleString()}</span></div>`);
      html+=`<p style="font-weight:700;margin:8px 0 4px">📦 订单 (${f.orders.length})</p>`;
      f.orders.slice(0,10).forEach(o=>html+=`<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0f0f0"><span>#${o.id} ${o.product_name||''}</span><span class="badge ${o.status==='done'?'badge-green':'badge-yellow'}">${o.status==='done'?'已完成':'持仓中'}</span><span style="color:var(--muted);font-size:10px">${new Date(o.created_at).toLocaleString()}</span></div>`);
      html+=`<p style="font-weight:700;margin:8px 0 4px">💵 �

值 (${f.deposits.length})</p>`;
      f.deposits.slice(0,5).forEach(d=>html+=`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${d.network}</span><span>$${Number(d.amount).toFixed(2)}</span><span class="badge ${d.status==='confirmed'?'badge-green':'badge-yellow'}">${d.status}</span></div>`);
      html+=`<p style="font-weight:700;margin:8px 0 4px">💸 提现 (${f.withdrawals.length})</p>`;
      f.withdrawals.slice(0,5).forEach(w=>html+=`<div style="display:flex;justify-content:space-between;padding:3px 0"><span>${w.network||''}</span><span>$${Number(w.amount).toFixed(2)}</span><span class="badge ${w.status==='completed'?'badge-green':w.status==='pending'?'badge-yellow':'badge-red'}">${w.status}</span></div>`);
      html+='</div>';dc.innerHTML=html;
    }catch(e){dc.innerHTML='<div class="empty">� 载失败</div>'}
  }else if(tab==='invite'){
    dc.innerHTML='<div class="empty">� 载中...</div>';
    try{
      let inv='';
      if(u.parent_id){try{const p=await api('GET','/admin/users/'+u.parent_id);inv+=`<p style="font-size:12px;margin-bottom:8px">⬆️ 上级: <b>${p.name||p.email}</b></p>`}catch(e){}}
      else inv+='<p style="font-size:12px;margin-bottom:8px;color:var(--muted)">⬆️ � 上级</p>';
