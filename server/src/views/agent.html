<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代理后台</title>
<style>
:root{--red:#FF5000;--bg:#FFF8F0;--white:#FFF;--text:#2D2D2D;--muted:#8B7355;--success:#2E7D32;--danger:#DC2626;--blue:#2563EB;--border:#e5e7eb}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body.login-body{display:flex;align-items:center;justify-content:center}
.login-box{background:var(--white);border-radius:20px;padding:40px 32px;width:380px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,.08);text-align:center}
.login-box h1{font-size:24px;margin-bottom:4px}.login-box .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--red)}
.login-box button{width:100%;padding:13px;background:linear-gradient(135deg,var(--red),#E04500);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer}
.login-box .err{color:var(--danger);font-size:13px;margin-bottom:12px;min-height:20px}
header{background:linear-gradient(135deg,var(--red),#E04500);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-size:18px}header .logout{background:rgba(255,255,255,.2);color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:13px}
nav{background:var(--white);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px;position:sticky;top:56px;z-index:99}
nav button{padding:12px 16px;border:none;background:none;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
nav button.active{color:var(--red);border-bottom-color:var(--red);font-weight:600}
main{padding:20px;max-width:1400px;margin:0 auto}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:12px;padding:16px;border:1px solid var(--border)}
.stat-card .label{font-size:11px;color:var(--muted);margin-bottom:4px}.stat-card .value{font-size:24px;font-weight:700}
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.card-body{padding:18px}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;background:#fafafa;color:var(--muted);font-weight:500;font-size:11px;border-bottom:1px solid var(--border)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}tr:hover{background:#fdf5f5}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#e8f5e9;color:var(--success)}.badge-red{background:#fce4ec;color:var(--danger)}
.badge-yellow{background:#fff8e1;color:#f57c00}.badge-blue{background:#e3f2fd;color:var(--blue)}
.btn{padding:8px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer}.btn-green{background:var(--success);color:#fff}.btn-red{background:var(--danger);color:#fff}.btn-blue{background:var(--blue);color:#fff}.btn-gray{background:#f0f0f0;color:var(--text)}.btn-sm{padding:5px 12px;font-size:11px}
.toast{position:fixed;top:20px;right:20px;z-index:999;background:var(--success);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);display:none}
.toast.error{background:var(--danger)}.empty{text-align:center;padding:40px;color:var(--muted);font-size:14px}
</style>
</head>
<body class="login-body">
<div id="loginPage">
<div class="login-box"><h1>代理后台</h1><p class="sub">代理账号登录</p>
<input id="loginEmail" placeholder="代理邮箱"><input id="loginPass" type="password" placeholder="密码">
<div class="err" id="loginErr"></div><button onclick="doLogin()">登 录</button></div></div>

<div id="mainApp" style="display:none;width:100%">
<header><h1>代理后台</h1><div><span id="agentInfo" style="font-size:12px;opacity:.8;margin-right:12px"></span><button class="logout" onclick="logout()">退出</button></div></header>
<nav id="nav"></nav><main id="content"></main></div>
<div class="toast" id="toast"></div>

<script>
var API='/api',token='',currentTab='team',uId=null;
function doLogin(){
  var e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;
  fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})})
  .then(function(r){return r.json().then(function(d){return{ok:r.ok,data:d}})})
  .then(function(x){if(!x.ok||!x.data.user.is_agent){document.getElementById('loginErr').textContent='需要代理账号';return}
    token=x.data.access_token;uId=x.data.user.id;localStorage.setItem('agent_token',token);
    document.getElementById('agentInfo').textContent=x.data.user.email;
    document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';
    document.body.classList.remove('login-body');initApp()}).catch(function(){document.getElementById('loginErr').textContent='登录失败'})}
function logout(){localStorage.removeItem('agent_token');location.reload()}
function apicall(method,path,body){
  return fetch(API+path,{method:method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'请求失败');return d})})}
function toast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(err?' error':'');t.style.display='block';setTimeout(function(){t.style.display='none'},3000)}
function initApp(){var saved=localStorage.getItem('agent_token');if(saved){token=saved;apicall('GET','/auth/me').then(function(u){uId=u.id;document.getElementById('agentInfo').textContent=u.email;document.getElementById('loginPage').style.display='none';document.getElementById('mainApp').style.display='block';document.body.classList.remove('login-body');if(!u.is_agent){logout();return};renderNav();switchTab('team')}).catch(function(){logout()});return}renderNav();switchTab('team')}
function renderNav(){var tabs=[['team','我的团队'],['ops','上下分记录']];document.getElementById('nav').innerHTML=tabs.map(function(x){return'<button class="'+(x[0]===currentTab?'active':'')+'" onclick="switchTab(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function switchTab(tab){currentTab=tab;renderNav();var c=document.getElementById('content');if(tab==='team')loadTeam(c);else if(tab==='ops')loadOps(c)}

function loadTeam(c){c.innerHTML='<div class="empty">加载中...</div>';
  apicall('GET','/referral/stats').then(function(s){
  apicall('GET','/users/me/invitees?limit=200').then(function(d){var invitees=d.invitees||[];
  c.innerHTML='<div class="stats-grid"><div class="stat-card"><div class="label">团队总人数</div><div class="value">'+s.total_invites+'</div></div><div class="stat-card"><div class="label">直接邀请</div><div class="value">'+s.direct_count+'</div></div><div class="stat-card"><div class="label">有效邀请</div><div class="value blue">'+s.effective_invites+'</div></div></div>'+
  '<div class="card"><div class="card-header">团队成员 ('+invitees.length+')</div><div class="card-body"><table><thead><tr><th>用户</th><th>邮箱</th><th>等级</th><th>加入时间</th><th>操作</th></tr></thead><tbody>'+
  (invitees.length===0?'<tr><td colspan="5" class="empty">暂无团队成员</td></tr>':invitees.map(function(u){return'<tr><td><b>'+(u.name||u.email||'-')+'</b></td><td>'+u.email+'</td><td>Lv.'+u.level+'</td><td style="font-size:10px">'+new Date(u.invited_at).toLocaleString()+'</td><td><button class="btn btn-sm btn-blue" onclick="showAdjust('+u.id+',\''+(u.name||u.email||'').replace(/'/g,"")+'\')">上下分</button></td></tr>'}).join(""))+'</tbody></table></div></div>'})
  .catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}).catch(function(e){c.innerHTML='<div class="empty">'+e.message+'</div>'})}

function showAdjust(uid,name){
  var d=document.createElement("div");d.className="modal-overlay";d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML='<div class="modal" style="background:var(--white);border-radius:16px;width:100%;max-width:380px;padding:24px" onclick="event.stopPropagation()"><h2 style="margin-bottom:12px">'+name+'</h2>'+
  '<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--muted)">金额 ($) — 正数上分 / 负数下分</label><input id="adjAmt" type="number" step="0.01" placeholder="例如: 10 或 -5"></div>'+
  '<div style="margin-bottom:10px"><label style="font-size:12px;color:var(--muted)">备注</label><input id="adjNote" placeholder="备注"></div>'+
  '<div style="display:flex;gap:8px"><button class="btn btn-blue" onclick="doAdjust('+uid+')">确认</button><button class="btn btn-gray" onclick="this.closest(\'.modal-overlay\').remove()">取消</button></div></div>';
  d.addEventListener("click",function(e){if(e.target===d)d.remove()});document.body.appendChild(d)}
function doAdjust(uid){var amt=parseFloat(document.getElementById("adjAmt").value),note=document.getElementById("adjNote").value;
  if(!amt||isNaN(amt)){toast("请输入有效金额",1);return}
  apicall('POST','/admin/users/'+uid+'/balance',{amount:amt,note:'[代理] '+(note||'')}).then(function(d){
    apicall('POST','/admin/agent-ops',{agent_id:uId,target_user_id:uid,action:'adjust',amount:amt,detail:note||''}).catch(function(){});
    toast(amt>0?'上分 $'+amt+' 成功':'下分 $'+Math.abs(amt)+' 成功');document.querySelector('.modal-overlay').remove();switchTab('team')}).catch(function(e){toast(e.message,1)})}

function loadOps(c){c.innerHTML='<div class="card"><div class="card-header">上下分记录</div><div class="card-body"><div class="empty">加载中...</div></div></div>';
  apicall('GET','/admin/agent-ops').then(function(rows){c.innerHTML='<div class="card"><div class="card-header">上下分记录 ('+rows.length+')</div><div class="card-body"><table><thead><tr><th>时间</th><th>代理ID</th><th>目标用户</th><th>金额</th><th>备注</th></tr></thead><tbody>'+
  (rows.length===0?'<tr><td colspan="5" class="empty">暂无记录</td></tr>':rows.map(function(o){return'<tr><td style="font-size:10px">'+new Date(o.created_at).toLocaleString()+'</td><td>#'+o.agent_id+'</td><td>#'+(o.target_user_id||'-')+'</td><td style="font-weight:700;color:'+(Number(o.amount)>=0?'var(--success)':'var(--danger)')+'">'+(Number(o.amount)>=0?'+':'')+'$'+Math.abs(Number(o.amount)).toFixed(2)+'</td><td style="font-size:10px">'+(o.detail||'')+'</td></tr>'}).join(""))+'</tbody></table></div></div>'}).catch(function(e){c.innerHTML='<div class="card"><div class="card-header">上下分记录</div><div class="card-body"><div class="empty">'+e.message+'</div></div></div>'})}
</script>
</body>
</html>
