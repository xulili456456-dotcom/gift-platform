app = 'gift-platform'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3001'

[[mounts]]
  source = 'sqlite_data'
  destination = '/app/server/data'

[[mounts]]
  source = 'uploads_data'
  destination = '/app/server/uploads'

[[services]]
  protocol = 'tcp'
  internal_port = 3001

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = '15s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'
