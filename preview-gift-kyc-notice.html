<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>礼物详情 - KYC 声明预览</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f2f7;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
    .phone{width:390px;min-height:100vh;background:#fff;position:relative;box-shadow:0 0 30px rgba(0,0,0,.1)}

    /* Header */
    .header{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid #e5e7eb;background:#fff}
    .header .back{color:#FF5000;font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:4px;border:none;background:none}
    .header .title{font-size:16px;font-weight:700;color:#2D2D2D}

    .content{padding:16px}

    /* Gift Hero */
    .gift-hero{border-radius:16px;padding:24px;text-align:center;margin-bottom:20px;background:linear-gradient(135deg,#1E1E32,#262636);border:2px solid #D4A853;position:relative}
    .gift-hero .emoji{font-size:60px;margin-bottom:12px}
    .gift-hero .amount{font-size:36px;font-weight:900;color:#FF5000}
    .gift-hero .desc{font-size:13px;color:#8B7355;margin-top:8px}
    .gift-hero .badge{position:absolute;top:12px;right:12px;background:#D4A853;color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600}

    /* KYC Notice - NEW */
    .kyc-notice{background:#FFF3E0;border:1px solid #FFB74D;border-left:4px solid #FF9800;border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:flex-start}
    .kyc-notice .icon{font-size:22px;flex-shrink:0;margin-top:1px}
    .kyc-notice .text{flex:1}
    .kyc-notice .text .title{font-size:13px;font-weight:700;color:#E65100;margin-bottom:4px}
    .kyc-notice .text .body{font-size:12px;color:#8D6E63;line-height:1.6}
    .kyc-notice .text .body strong{color:#E65100}

    /* Progress Section */
    .section{background:#fff;border-radius:16px;border:1px solid #e5e7eb;padding:20px;margin-bottom:16px}
    .section h3{font-size:14px;font-weight:700;color:#2D2D2D;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .section h3 svg{color:#FF5000}
    .row{display:flex;justify-content:space-between;font-size:13px;padding:8px 0}
    .row .label{color:#8B7355}
    .row .value{font-weight:700;color:#2D2D2D}
    .progress-bar{width:100%;height:12px;background:#f2f2f7;border-radius:100px;overflow:hidden;margin-top:8px}
    .progress-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,#FF5000,#FF8A3D);transition:width .7s}
    .progress-text{font-size:11px;color:#8B7355;margin-top:8px}

    /* Gift Info */
    .info-row{display:flex;justify-content:space-between;font-size:13px;padding:12px 0;border-bottom:1px solid #e5e7eb}
    .info-row:last-child{border-bottom:none}
    .info-row .label{color:#8B7355}
    .info-row .value{font-weight:600;color:#2D2D2D}

    /* KYC Verification Steps - NEW */
    .kyc-steps{background:#F5F7FA;border-radius:12px;padding:14px 16px;margin-bottom:16px}
    .kyc-steps .steps-title{font-size:12px;font-weight:700;color:#546E7A;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
    .kyc-steps .step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12px;color:#607D8B}
    .kyc-steps .step .num{width:22px;height:22px;border-radius:50%;background:#FF9800;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
    .kyc-steps .step .done{background:#4CAF50}
    .kyc-steps .step .done-text{color:#388E3C;font-weight:600}

    /* Claim Button */
    .claim-btn{width:100%;padding:16px;border-radius:16px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .15s;background:linear-gradient(135deg,#FF5000,#FF8A3D);color:#fff;box-shadow:0 4px 16px rgba(255,80,0,.25)}
    .claim-btn:active{transform:scale(.98)}
    .claim-btn.disabled{background:#e5e7eb;color:#999;box-shadow:none;cursor:not-allowed}
  </style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <button class="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        返回
      </button>
      <span class="title">新人红包</span>
    </div>

    <div class="content">
      <!-- Gift Hero -->
      <div class="gift-hero">
        <div class="badge">🎁 新人专享</div>
        <div class="emoji">🧧</div>
        <div class="amount">$5</div>
        <div class="desc">邀请1位好友即可领取，新人专享福利</div>
      </div>

      <!-- ⭐ KYC Notice -->
      <div class="kyc-notice">
        <div class="icon">⚠️</div>
        <div class="text">
          <div class="title">实名认证声明</div>
          <div class="body">
            您邀请的好友必须完成<strong>实名认证（KYC）</strong>，审核通过后才会被计入有效邀请。
            未完成实名认证的邀请将<strong>不计入领取资格</strong>，请确保邀请的是真实用户。
          </div>
        </div>
      </div>

      <!-- KYC Verification Steps -->
      <div class="kyc-steps">
        <div class="steps-title">📋 好友需要完成的步骤</div>
        <div class="step">
          <span class="num done">1</span>
          <span class="done-text">注册账号</span>
        </div>
        <div class="step">
          <span class="num done">2</span>
          <span class="done-text">填写邀请码</span>
        </div>
        <div class="step">
          <span class="num">3</span>
          <span>前往「我的」→「实名认证」提交身份信息</span>
        </div>
        <div class="step">
          <span class="num">4</span>
          <span>等待审核通过后，邀请自动生效</span>
        </div>
      </div>

      <!-- Progress -->
      <div class="section">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          领取进度
        </h3>
        <div class="row">
          <span class="label">需要邀请</span>
          <span class="value">1 人</span>
        </div>
        <div class="row">
          <span class="label">有效邀请（已实名）</span>
          <span class="value" style="color:#4CAF50">1 人 ✅</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:100%"></div>
        </div>
        <div class="progress-text">✅ 可领取</div>
      </div>

      <!-- Gift Info -->
      <div class="section">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
          礼物信息
        </h3>
        <div class="info-row">
          <span class="label">所需邀请人数</span>
          <span class="value">1 人</span>
        </div>
        <div class="info-row">
          <span class="label">礼物类型</span>
          <span class="value">现金红包</span>
        </div>
        <div class="info-row">
          <span class="label">领取进度</span>
          <span class="value" style="color:#FF5000">100%</span>
        </div>
      </div>

      <!-- Claim Button -->
      <button class="claim-btn">🎁 立即领取 $5</button>
    </div>
  </div>
</body>
</html>
